spring.application.name=freelancer

# ===== MySQL Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/freelancer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Server =====
server.port=8080

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ===== JWT =====
app.jwt.secret=ThisIsASecretKeyForFreelancerProjectManagementSystemChangeItInProduction123456
app.jwt.expiration-ms=86400000

# ===== CORS =====
app.cors.allowed-origin=http://localhost:5173
